<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      color: #fff;
      margin: 0;
      height: 100vh;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .login-container {
      max-width: 350px;
      width: 90vw;
      margin: 10vh auto;
      padding: 32px 5vw;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid #444;
    }
    h2 {
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 2px;
      font-size: 1.4em;
      font-weight: 600;
      color: #e74c3c;
      text-shadow: 0 0 8px #e74c3c44;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0 18px 0;
      border: none;
      border-radius: 6px;
      background: #222;
      color: #fff;
      font-size: 1em;
      box-shadow: 0 2px 8px #0002;
      box-sizing: border-box;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      background: #333;
      box-shadow: 0 0 0 2px #e74c3c55;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px #e74c3c44;
      transition: background 0.2s;
    }
    button:hover {
      background: #c0392b;
    }
    .error {
      color: #e74c3c;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
    .seal {
      display: block;
      margin: 0 auto 18px auto;
      width: 60px;
      max-width: 20vw;
      filter: drop-shadow(0 0 8px #e74c3c88);
    }
    .gov-label {
      text-align: center;
      font-size: 1.1em;
      color: #e74c3c;
      margin-bottom: 10px;
      letter-spacing: 1px;
      font-weight: 500;
      text-shadow: 0 0 6px #e74c3c33;
    }
    @media (max-width: 500px) {
      .login-container {
        padding: 24px 2vw;
        max-width: 98vw;
      }
      h2 {
        font-size: 1.1em;
      }
      .seal {
        width: 40px;
        max-width: 30vw;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Great_Seal_of_the_United_States_of_America_%281782%29.svg/250px-Great_Seal_of_the_United_States_of_America_%281782%29.svg.png" class="seal" alt="Government Seal">
    <div class="gov-label">Official Access Portal</div>
    <h2>Restricted Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
      <div id="errorMsg" class="error"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim().toLowerCase();
      var password = document.getElementById('password').value.trim().toLowerCase();
      if (username === 'martin' && password === 'nielsen') {
        window.location.href = 'success.html';
      } else {
        document.getElementById('errorMsg').textContent = 'Invalid credentials.';
      }
    });
  </script>
</body>
</html>
